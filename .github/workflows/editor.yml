# Builds the product site (site/), the editor demo and the day page editor, and publishes them with GitHub Pages:
#   /            the Journalwright Studio site (site/)
#   /editor/     the live editor DEMO: generic profile + test.ics only, never saves anywhere, "demo, sample data" banner
#   /app/        the working editor (saves in the browser, commits daypage.json with a token); it used to live at the root
# Everything published is generic sample data, so the site is safe to be public.
# Private repo on a free plan (no Pages)? Set the EDITOR_PAGES_REPO variable (e.g. you/keeping-watch-editor, a public
# repo) and the EDITOR_PAGES_TOKEN secret (token with contents:write on it); the site is pushed there instead.
name: Editor
on:
  push:
    branches: [main]
    paths: ['journal/daypage.mjs', 'journal/scan.mjs', 'journal/pages.mjs', 'journal/book.mjs', 'journal/bookrules.mjs', 'journal/bookedit.mjs', 'journal/context.mjs', 'journal/editor/**', 'journal/content/layouts.mjs', 'journal/render.mjs', 'journal/content/daypage.json', 'journal/profile.mjs', 'journal/content/profile.example.json', 'site/**', 'docs/journaling/methods/**', 'CONTRIBUTING.md', 'studio/src/diff.mjs', 'studio/src/canonical.mjs', '.github/workflows/editor.yml']
  pull_request:
    paths: ['site/**', 'docs/journaling/methods/**', 'CONTRIBUTING.md', 'journal/profile.mjs', 'journal/content/profile.example.json', 'journal/daypage.mjs', 'journal/scan.mjs', 'journal/pages.mjs', 'journal/book.mjs', 'journal/bookrules.mjs', 'journal/bookedit.mjs', 'journal/context.mjs', 'journal/editor/**', 'journal/content/layouts.mjs', 'studio/src/diff.mjs', 'studio/src/canonical.mjs']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: "${{ github.event_name == 'pull_request' && format('editor-{0}', github.ref) || 'pages' }}", cancel-in-progress: true }  # PR runs only cancel their own PR; main pushes share the Pages group
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: journal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: journal/package-lock.json }
      - run: npm ci && npx playwright-core install --with-deps chromium
      - name: Sample book (test.ics only) for the page CSS
        run: node render.mjs month 2026-10 test.ics
      - run: node editor/build.mjs
      - name: Editor tests (drag from palette, every block, overflow meter)
        run: node editor/test.mjs
      - name: Accessibility checks (axe, names, contrast tokens, 44 px targets, reflow at 320/390, focus, reduced motion, keyboard tasks); fails on anything not in the documented allowlist
        run: node editor/test-a11y.mjs --report
      - name: Assemble the site (root), the editor demo (/editor/) and the working editor (/app/); check links
        run: |
          "$GITHUB_WORKSPACE/site/build.sh" "$GITHUB_WORKSPACE/_site"
          mkdir -p "$GITHUB_WORKSPACE/_site/app" && cp -r editor/dist/site/. "$GITHUB_WORKSPACE/_site/app/"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: editor-test-screens, path: journal/editor/dist/test/ }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.EDITOR_PAGES_REPO == ''
        with: { path: _site }
      - name: Push to the public editor repo instead
        if: github.event_name != 'pull_request' && vars.EDITOR_PAGES_REPO != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.EDITOR_PAGES_TOKEN }}
          external_repository: ${{ vars.EDITOR_PAGES_REPO }}
          publish_branch: gh-pages
          publish_dir: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.EDITOR_PAGES_REPO == ''
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
