# Builds every book: the Keeper, then each month at 5.5x8.5 and 8.5x11 (interior + cover), EPUBs, and the X4 SD card.
# With the ICS_URLS secret set, books include your calendar and are uploaded ONLY inside a password-protected 7z
# (BOOKS_PASSWORD secret). Without it, the build uses test.ics and uploads a plain sample zip.
name: Books
on:
  push:
    branches: [main]
    paths: ['journal/**', 'studio/**', '.github/workflows/books.yml']
  workflow_dispatch:
    inputs:
      months: { description: 'Months, e.g. "2026-10 2026-11" (blank = all 12)', required: false, default: '' }
      sizes: { description: 'small, letter, or both', required: false, default: 'small letter' }
      hardcover: { description: 'KDP hardcover: pad to 76+ pages and build hardcover covers (5.5x8.5 only)', type: boolean, default: false }
concurrency: { group: 'books-${{ github.ref }}', cancel-in-progress: true }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: journal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: journal/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          pip install pillow
          sudo apt-get install -y -q poppler-utils p7zip-full >/dev/null
      - name: Data checks (event order, moon signs, eclipses, meteors)
        run: node test-data.mjs
      - name: Book layout check (content/book.json validation, hide/move/per-month, alignment, padding)
        run: node test-book.mjs
      - name: Page organiser check (the editor's live layout equals assemble(); every change is allowed or refused with a plain reason; what it saves validates and builds, check.mjs [] 0, check-pages, check-codes)
        run: node test-organiser.mjs
      - name: "Block pages check (C5a: Notes, blank and collection pages as blocks on their own grids; a page with no layout prints as before; the rules say what is wrong; flowBook equals assemble(); the edited book builds, check.mjs [] 0, scan zones on every block)"
        run: node test-blockpages.mjs
      - name: Busy-calendar check (month cells and week rows cap and clamp; every page fits)
        run: node test-busy.mjs
      - name: Profile check (a generic person in a made-up city builds a clean book; module switches remove their pages)
        run: node test-profile.mjs
      - name: Book plan check (every scope builds; a year splits into volumes that pass every gate; undated books print no dates; codes unique across books)
        run: node test-scopes.mjs
      - name: Library check (books and series, custom titles on covers and title pages, series defaults with per-book override, a single-book profile migrates and builds the same book)
        run: node test-library.mjs
      - name: Pack check (manifest schema, file hashes, the kind registry, the support verification rule, the generic pack builds clean, the personal pack reproduces the committed books)
        run: node test-packs.mjs
      - name: "Puzzle check (seeded word search and crossword generators: same seed same grid, all words placed, crossword valid; the puzzles pack kind; print-safe SVG with a text alternative; a book with both blocks passes check.mjs, no Type 3 fonts, zones mapped)"
        run: node test-puzzles.mjs
      - name: "Onboarding check (npm run init in a scratch copy: valid profile, never overwrites, sample book passes the overflow gate)"
        run: node test-init.mjs
      - name: Scan options check (Send-to block, border off, code position/size/format/content, no code, unique codes across books)
        run: node test-scan.mjs
      - name: "Print accessibility check (large print and high-contrast ink: off is byte-identical, on passes check.mjs in both trims and hardcover, no Type 3 fonts, scan zones where they were, bigger type and darker rules, a quarter book keeps its volumes within 24 to 110 pages)"
        run: node test-a11y-print.mjs
      - name: 'Studio tests (versioning - commits, branches, drafts, forbidden content, authorization, import/export round trip, editor to print)'
        # Sample data only (test.ics). The Keeper, the sample month and the editor are built here just for these tests; the Build step below
        # overwrites all of them, so nothing from this step is packaged. Needs Node 22.13+ (built-in SQLite).
        run: |
          node keeper.mjs
          node render.mjs month 2026-10 test.ics
          node editor/build.mjs
          cd ../studio && npm test
      - name: Calendars (from the ICS_URLS secret, never committed)
        env: { ICS_URLS: '${{ secrets.ICS_URLS }}' }
        run: |
          if [ -z "$ICS_URLS" ]; then echo "ICS=test.ics" >> "$GITHUB_ENV"; echo "No ICS_URLS secret: building sample books."; exit 0; fi
          mkdir -p private; i=0; list=""
          for u in $(printf '%s' "$ICS_URLS" | tr ',\n' '  '); do
            echo "::add-mask::$u"; i=$((i+1)); curl -fsSL --retry 3 "$u" -o "private/cal$i.ics"; list="$list,private/cal$i.ics"
          done
          echo "ICS=${list#,}" >> "$GITHUB_ENV"; echo "PERSONAL=1" >> "$GITHUB_ENV"; echo "Fetched $i calendar(s)."
      - name: Build
        env:
          MONTHS: ${{ inputs.months }}
          SIZES: ${{ inputs.sizes || 'small letter' }}
          HARDCOVER: ${{ inputs.hardcover && '1' || '' }}
        run: |
          [ -n "$MONTHS" ] || unset MONTHS
          [ -n "$HARDCOVER" ] || unset HARDCOVER
          ./build-all.sh
      - name: No Type 3 fonts (KDP rejects them)
        run: |
          bad=0; for f in out/*/*interior*.pdf out/keeper/*.pdf; do if pdffonts "$f" | grep -q "Type 3"; then echo "::error::Type 3 font in $f"; bad=1; fi; done; exit $bad
      - name: X4 SD card
        run: python3 ../x4/tools/export_pack.py . out/sd-card
      - name: Package
        env: { BOOKS_PASSWORD: '${{ secrets.BOOKS_PASSWORD }}' }
        run: |
          mkdir -p ../dist
          files=$(ls out/*/*.pdf out/*/*.epub out/*/layout.json out/*/manifest.json 2>/dev/null)
          if [ "${PERSONAL:-}" = 1 ]; then
            if [ -z "$BOOKS_PASSWORD" ]; then echo "::error::Set the BOOKS_PASSWORD secret: personal books are never uploaded unencrypted."; exit 1; fi
            7z a -t7z -mhe=on -p"$BOOKS_PASSWORD" ../dist/keeping-watch-books.7z $files out/sd-card >/dev/null
          else
            7z a -tzip ../dist/keeping-watch-sample-books.zip $files out/sd-card >/dev/null
          fi
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with: { name: keeping-watch-books, path: dist/, retention-days: 14, compression-level: 0 }
