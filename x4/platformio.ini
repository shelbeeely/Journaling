; Keeping Watch firmware for the Xteink X4 (ESP32-C3) on the FreeInk SDK.
; Put a FreeInk SDK checkout next to this folder (git clone https://github.com/Free-Ink/freeink-sdk ../freeink-sdk)
; or change FREEINK below. Build: pio run   Flash over USB-C: pio run -t upload   Logs: pio device monitor
;
; Tip: flash it to the second OTA slot and keep CrossPoint in the first (see README), so the X4 can still read books.

[freeink]
path = ../freeink-sdk

[env:x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
; Same layout as CrossPoint (two 6.25 MB app slots), so both firmwares can live on one X4.
board_build.partitions = partitions.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X4=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1
build_src_filter = +<*> -<../host/>
lib_deps =
  BoardConfig=symlink://${freeink.path}/libs/hardware/BoardConfig
  EInkDisplay=symlink://${freeink.path}/libs/display/FreeInkDisplay
  InputManager=symlink://${freeink.path}/libs/hardware/InputManager
  BatteryMonitor=symlink://${freeink.path}/libs/hardware/BatteryMonitor
  SDCardManager=symlink://${freeink.path}/libs/hardware/SDCardManager
  PowerManager=symlink://${freeink.path}/libs/hardware/PowerManager
  XteinkDetect=symlink://${freeink.path}/libs/hardware/XteinkDetect

; The sync build (BUILD-PLAN N2): the SDK's SecureNet (wolfSSL TLS 1.3) linked in, with the sync client (Menu > Wi-Fi > Sync with Studio).
; The default env x4 has no TLS: its Sync row says so and sends nothing. The SDK's SecureClient does not check the server's host name, so this
; env links with -Wl,--wrap=wolfSSL_UseSNI and net/hostcheck.cpp arms wolfSSL_check_domain_name on every session (and sync refuses without it).
; Build: pio run -e x4-tls   (the wolfSSL settings are tls/user_settings.h)
[env:x4-tls]
extends = env:x4
build_flags =
  ${env:x4.build_flags}
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -iquote tls
  -Wl,--wrap=wolfSSL_UseSNI
lib_deps =
  ${env:x4.lib_deps}
  SecureNet=symlink://${freeink.path}/libs/network/SecureNet
  wolfssl/wolfssl@5.7.2
